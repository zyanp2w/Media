<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simpan Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14231c;--mute:#5d6e65;--line:#d3ddd7;--acc:#0e6b4f;--accink:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#17221c;--ink:#e8f1ec;--mute:#92a69b;--line:#2a3a32;--acc:#4fd1a1;--accink:#06251a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5;min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:520px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1;margin:0 0 12px;letter-spacing:-.02em}
p.sub{color:var(--mute);margin:0 0 24px}
.box{display:flex;gap:8px}
input{flex:1;min-width:0;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 18px;background:var(--acc);color:var(--accink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
#msg{min-height:1.5em;margin:12px 0;color:var(--mute)}
#msg.err{color:var(--err)}
#hasil{display:none;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
#hasil img{width:100%;max-height:260px;object-fit:cover;display:block;background:var(--line)}
.info{padding:16px}
.info b{display:block;margin-bottom:2px;overflow-wrap:anywhere}
.info span{color:var(--mute);font-size:.9rem}
.aksi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 16px}
small{display:block;margin-top:24px;color:var(--mute);font-size:.82rem}
</style>
</head>
<body>
<main>
  <h1>Simpan media dari link</h1>
  <p class="sub">Tempel link publik dari Facebook, Instagram, atau TikTok.</p>
  <div class="box">
    <input id="url" type="url" inputmode="url" placeholder="https://www.tiktok.com/@..." aria-label="Link media">
    <button id="cek">Cek link</button>
  </div>
  <div id="msg" role="status"></div>
  <section id="hasil">
    <img id="thumb" alt="">
    <div class="info"><b id="judul"></b><span id="oleh"></span></div>
    <div class="aksi">
      <button data-k="video">Video</button>
      <button data-k="audio" class="ghost">Audio MP3</button>
      <button data-k="photo" class="ghost">Foto</button>
    </div>
  </section>
  <small>Unduh hanya konten milik Anda atau yang pemiliknya mengizinkan. Hormati hak cipta dan aturan tiap platform.</small>
</main>
<script>
const $=id=>document.getElementById(id);
const msg=(t,e)=>{$('msg').textContent=t;$('msg').className=e?'err':''};
$('cek').onclick=async()=>{
  const url=$('url').value.trim();
  if(!url){msg('Tempel link dulu.',1);return}
  $('cek').disabled=true;$('hasil').style.display='none';msg('Membaca link…');
  try{
    const r=await fetch('/api/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Gagal membaca link.');
    $('thumb').src=d.thumbnail||'';
    $('judul').textContent=d.title||'Tanpa judul';
    $('oleh').textContent=d.uploader||'';
    $('hasil').style.display='block';msg('');
  }catch(e){msg(e.message,1)}
  $('cek').disabled=false;
};
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
  const url=$('url').value.trim();
  msg('Menyiapkan unduhan… tunggu sebentar.');
  window.location.href='/api/download?kind='+b.dataset.k+'&url='+encodeURIComponent(url);
  setTimeout(()=>msg(''),6000);
});
</script>
</body>
</html>
